services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /workspace/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - finmarket_lab.api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src

  pytorch-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    gpus: all
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root

volumes:
  frontend_node_modules:
